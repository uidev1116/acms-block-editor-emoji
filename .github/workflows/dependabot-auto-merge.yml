name: Dependabot auto-merge

# Auto-merge Dependabot PRs once the required checks pass:
#   - production dependencies: patch and minor updates only (a major update is reviewed by hand)
#   - development dependencies: major, minor and patch updates
#   - everything else, mainly indirect dependencies (the *-other groups): minor and patch updates
#   - GitHub Actions: patch and minor updates
#   - indirect dependencies updated on their own (not in a group): minor and patch updates
# The groups are defined in .github/dependabot.yml.
#
# Requires (in repo Settings): "Allow auto-merge" enabled, and a branch protection rule on the
# default branch with the Test workflow as a required status check — otherwise --auto has no check
# to wait for and would merge without CI.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Anything outside these groups (e.g. a major update of a production dependency) is left for manual review
      - name: Enable auto-merge
        if: >-
          (steps.metadata.outputs.dependency-type == 'indirect' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')) ||
          ((steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.metadata.outputs.package-ecosystem == 'github_actions') ||
          steps.metadata.outputs.dependency-group == 'npm-production' ||
          steps.metadata.outputs.dependency-group == 'npm-development' ||
          steps.metadata.outputs.dependency-group == 'npm-other' ||
          steps.metadata.outputs.dependency-group == 'composer-production' ||
          steps.metadata.outputs.dependency-group == 'composer-development' ||
          steps.metadata.outputs.dependency-group == 'composer-other'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
