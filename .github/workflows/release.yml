name: Release

# Build the plugin zip (scripts/package.php) and publish it as a GitHub Release.
# Pushing a tag like v1.2.3 triggers this.
#
# The plugin version lives in src/ServiceProvider.php ($version). Keep the tag and that value in
# sync — the "Verify" step below fails the run if they disagree, so no mismatched zip is published.
#
# The guard step below skips the job when scripts/namespace.php exists (a leftover of the plugin
# skeleton; it self-deletes when the skeleton is turned into a plugin).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip release on the unconverted skeleton
        id: guard
        run: |
          if [ -f scripts/namespace.php ]; then
            echo "scripts/namespace.php present — this is the plugin skeleton, not a generated plugin. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.guard.outputs.skip != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: zip
          tools: composer

      # The JS / CSS / emoji data (src/assets) are not committed. Build them here so they ship
      # inside the package (scripts/package.php copies src/ as it is on disk).
      - name: Set up Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build assets
        if: steps.guard.outputs.skip != 'true'
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          test -s src/assets/index.js
          test -s src/assets/index.css
          test -s src/assets/emojibase/ja/data.json

      - name: Verify tag matches ServiceProvider $version
        if: steps.guard.outputs.skip != 'true'
        run: php scripts/package.php --check-version="${GITHUB_REF_NAME#v}"

      - name: Create release package
        if: steps.guard.outputs.skip != 'true'
        run: php scripts/package.php

      - name: Create GitHub Release
        if: steps.guard.outputs.skip != 'true'
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ./build/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
