# Keep GitHub Actions, npm and Composer dependencies up to date (weekly).
#
# Auto-merge (.github/workflows/dependabot-auto-merge.yml): patch/minor updates of GitHub Actions and
# of development dependencies (npm and Composer) are merged once CI passes. Major updates, and npm
# runtime "dependencies" (they are bundled into the distributed JS), are reviewed by hand.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only. Revisit when it supports 6.1+ / 7.
      - dependency-name: 'typescript'
        versions: ['>=6.1.0']
      # @tiptap/* must stay on the version @ablogcms/block-editor uses. A different version installs a second
      # copy of @tiptap/core and breaks the Editor types, so bump them by hand with @ablogcms/*.
      - dependency-name: '@tiptap/*'
    # Indirect dependencies are updated too (Dependabot tracks direct ones only by default).
    allow:
      - dependency-type: 'all'
    groups:
      # Production dependencies: minor and patch updates only (a major update opens its own PR).
      npm-production:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      # Development dependencies: major, minor and patch updates are all grouped.
      npm-development:
        dependency-type: 'development'

  # All Composer packages are development tools. ablogcms/testing-framework is pinned to the
  # a-blog cms minor it tests against (3.2.*), so it stays on that line by its own constraint.
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Indirect dependencies are updated too (Dependabot tracks direct ones only by default).
    allow:
      - dependency-type: 'all'
    groups:
      # Production dependencies: minor and patch updates only (a major update opens its own PR).
      composer-production:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      # Development dependencies: major, minor and patch updates are all grouped.
      composer-development:
        dependency-type: 'development'
