# Keep the GitHub Actions and the npm dependencies up to date. Actions patch/minor bumps are
# auto-merged by .github/workflows/dependabot-auto-merge.yml once CI passes; major bumps are reviewed
# by hand. npm "dependencies" are bundled into the distributed JS, so they are never auto-merged.
#
# Composer is intentionally not tracked: its constraints are loose caret ranges on dev tools only,
# and ablogcms/testing-framework is version-matched to a-blog cms by hand.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'npm'
    directory: '/'
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only. Revisit when it supports 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    schedule:
      interval: 'weekly'
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
